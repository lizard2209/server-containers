services:
  # webui that your browser connects to
  beszel-hub:
    image: 'henrygd/beszel:latest'
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - '8090:8090'
    volumes:
      - ./beszel_data:/beszel_data

  # the agent that reads stats and docker containers
  beszel-agent:
    image: 'henrygd/beszel-agent:latest'
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 45876
      # api key
      KEY: "your-agent-public-key-here" 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
